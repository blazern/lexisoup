fragment SentenceFields on Sentence {
  text
  langIso3
  source
}

fragment TranslationsSetFields on TranslationsSet {
  original { ...SentenceFields }
  translations { ...SentenceFields }
  translationsQualities
}

fragment TranslatorParamsFields on TranslatorParams {
  translatorId
  textLengthMin
  textLengthMax
  batchSizeLimit
}
